<div class="location-tile">
  <app-dune-action
    [actionField]="location.actionField"
    [backgroundColor]="location.color"
    [disabled]="readonly && isActiveForPlayerCount"
  ></app-dune-action>
  @if (location.actionField.ownerReward) {
    <div class="location-owning-area" [class.blocked]="!isActiveForPlayerCount">
      <div
        [class]="'location-owner-indicator' + (owner ? ' owned' : '')"
        [class.owned]="owner"
        [class.active]="!readonly && isActiveForPlayerCount"
        [style.border-color]="owner ? owner.color : location.color"
        (click)="onOwnerIndicatorClicked()"
      >
        @if (owner) {
          <span class="location-owner-name font-medieval">{{ leaderInitials.toUpperCase() }}</span>
        }
      </div>
      <div class="location-owner-reward-area">
        <div class="location-owner-game-reward-area" [style.background-color]="location.color">
          <div class="location-owner-visitor-reward-container">
            <img class="location-owner-visitor-reward" [src]="location.actionField.ownerReward.type | effectTypePath" />
            <div class="location-owner-visitor-reward-amount">
              {{ location.actionField.ownerReward.amount }}
            </div>
          </div>
        </div>
        <div class="location-owner-finale-reward-area">
          <img class="location-owner-victory-point-finale" [src]="'victory-point' | effectTypePath" />
        </div>
        <div class="border-remover" [style.background-color]="location.color"></div>
      </div>
    </div>
  }
</div>
