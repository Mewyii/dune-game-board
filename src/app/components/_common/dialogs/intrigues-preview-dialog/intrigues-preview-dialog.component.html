<h1 mat-dialog-title [class]="data.colorScheme">{{ data.title }}</h1>
<div mat-dialog-content class="intrigues-container">
  @for (card of data.intrigues; track card) {
    <div
      class="card-container"
      [class.selectable]="isSelectMode"
      [class.selected]="isSelected(card)"
      (click)="onIntrigueClick(card)"
      (mouseenter)="hoveredCardId = card.id"
      (mouseleave)="hoveredCardId = ''"
    >
      @if (card.id === selectedIntrigue?.id || card.id === hoveredCardId) {
        <dune-highlighting
          [id]="card.id"
          [width]="220"
          [height]="300"
          [bottom]="-20"
          [left]="-25"
        ></dune-highlighting>
      }
      <dune-intrigue-card [card]="card"></dune-intrigue-card>
      @if (data.canAquireCards) {
        <div class="card-action-container">
          <button
            class="card-buy-button"
            mat-fab
            [color]="'accent'"
            (click)="onBuyCardClicked(card)"
          >
            <mat-icon>check</mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
<div mat-dialog-actions>
  @if (isSelectMode) {
    <button
      mat-mini-fab
      [color]="'accent'"
      [disabled]="!selectedIntrigue"
      (click)="onConfirm()"
      [matTooltip]="t.translate('commonConfirm')"
    >
      <mat-icon>check</mat-icon>
    </button>
  } @else {
    <button
      mat-mini-fab
      [color]="'accent'"
      (click)="onClose()"
      [matTooltip]="t.translate('commonCancel')"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</div>
